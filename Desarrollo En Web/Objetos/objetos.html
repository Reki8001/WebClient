<!DOCTYPE html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1">
        <title>Objeto Windows</title>
        <style>
            body{
                background-color: bisque;
            }
        </style>
    </head>
    <body>
        <script>
            //window.open("https://docs.godotengine.org/en/stable/getting_started/first_2d_game/index.html", "new", "width=500px", "height=500px")
            let my_window=window.open("http://127.0.0.1:2222/Desarrollo%20En%20Web/Condicionales/condicionales.html", "new", "width=500px, height=500px")
            function activar(miUrl){
                my_window.focus();
                my_window.location=miUrl
                //alert("Entra")
            }
            function tamaño(){
                //my_window.resizeBy(100, 200);
                my_window.focus();
                my_window.close(); //my_window.cuenta>=100?my_window.close():void(0)
            }
        </script>
        <button onclick="activar('http://127.0.0.1:2222/Desarrollo%20En%20Web/Condicionales/condicionales.html')">Activar</button>
        <button onclick="activar('https://www.elpais.es')">El país</button>
        <button onclick="tamaño()">Tamaño</button>
        <h1>contador</h1>
        <div id="contador">

        </div>
        <script>
            window.onload=contar;
            let cuenta=0;
            function contar(){
                cuenta+=5;
                contador.innerText=cuenta;
            }
        </script>
        <button onclick="contar()">Boton</button> <!--my_window.contar(); my_window.focus(); cuenta>=100?window.close():void(0)-->
    </body>
</html>
