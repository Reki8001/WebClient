<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Menú deslisable</title>
        <style>
            main{
                margin: 20px auto;
                width: 75%;
                border-radius: 5%;
                border: 1px solid black;
                height: 50vh;
                background-color:rgb(71, 89, 255);
                position:relative;
            }
            input[type="checkbox"]{
                display: none;
            }
            input:checked+label>b:nth-child(2){
                background-color: rgb(129, 127, 255);
                opacity:0;
            }
            input:checked+label>b:nth-child(1){
                transform: rotate(45deg) translateY(25px);
            }
            input:checked+label>b:nth-child(3){
                transform: rotate(-45deg) translateY(-25px)
            }
            input:checked~nav{
                opacity: 100%;
                clip-path: inset(0 0 0 0);
            }
            label{
                position: absolute;
                top: 25px;
                left: 25px;
                width: clamp(100px, 5vw, 300px);
                height: clamp(25px, 5vh, 275px);
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                z-index: 1;
            }
            hr{
                width: 80%;
                margin-left:1em;
                margin-right:1em;
                position: relative;
            }
            b{
                background-color: rgb(0, 10, 102);
                display:block;
                height: 3px;
                width: 70px;
                border-radius: 2em;
                transition: transform 3s ease, opacity 2s ease;
            }
            nav{
                width: 30%;
                height: 75%;
                background-color: rgb(99, 115, 255);
                padding-top: 5em;
                border-radius: 5%;
                margin-top: 1em;
                margin-left: 1em;
                clip-path: inset(0 100% 0 0);
                transition: all 2s ease;
                z-index: 0;
                opacity: 5%;
            }
            ol{
                display:flex;
                flex-direction: column;
                justify-content: space-around;
            }
            li{
                width: 80%;
                height: 40px;
                display: inline-block;
                border-radius: 5%;
                border-color: rgb(71, 89, 255);
            }
        </style>
        <!-- <link rel="stylesheet" href="estilo.css"> -->
    </head>
    <body>

        <main>
            <input type="checkbox" id="menu" name="menu">
            <label for="menu"><b></b><b></b><b></b></label>
            <nav>
                <ol>
                    <hr>
                    <li>1</li>
                    <hr>
                    <li>2</li>
                    <hr>
                    <li>3</li>
                    <hr>
                    <li>4</li>
                    <hr>
                    <li>5</li>
                    <hr>
                </ol>
            </nav>
        </main>

    </body>
    </html>
