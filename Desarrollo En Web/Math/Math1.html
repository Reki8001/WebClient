<!DOCTYPE html><html lang="es"> 
    <head> 
        <meta charset="UTF-8"> 
        <title>Math trial</title> 
        <style> 
             * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            }

            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #2f3e4e;
                font-family: Arial, sans-serif;
                color: #f5f1e6;
                padding: 20px;
            }

            .tarjeta {
                background: #3e5166;
                border: 1px solid #d4af37;
                border-radius: 10px;
                padding: 30px;
                width: 100%;
                max-width: 360px;
                text-align: center;
            }

            h1 {
                font-size: 1.3rem;
                color: #d4af37;
                margin-bottom: 22px;
                letter-spacing: 1px;
            }

            .campo {
                margin-bottom: 16px;
                text-align: left;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-size: 0.85rem;
                color: #e8c96a;
            }

            input,
            select {
                width: 100%;
                padding: 9px;
                border-radius: 6px;
                border: 1px solid #d4af37;
                background: #1f2a35;
                color: #f5f1e6;
                font-size: 1rem;
                outline: none;
            }

            button {
                width: 100%;
                padding: 11px;
                margin-top: 6px;
                border: none;
                border-radius: 6px;
                background: #d4af37;
                color: #1f2a35;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
            }

            button:hover {
                background: #e8c96a;
            }

            .resultado {
                margin-top: 20px;
                padding: 15px;
                border-radius: 8px;
                background: #1f2a35;
                border: 1px dashed #d4af37;
                font-size: 1.2rem;
                color: #d4af37;
                min-height: 55px;
                display: flex;
                align-items: center;
                justify-content: center;
                word-break: break-all;
            }
        </style>
    </head> 
    <body> 
        <div class="tarjeta">
        <h1>MATH TRIAL</h1> 
        <div class="campo"> 
            <label for="numero">Número</label> 
            <input type="number" id="numero" step="any" placeholder="Ej: 4.7"> 
        </div> 
        <div class="campo"> 
            <label for="operacion">Operación</label> 
            <select id="operacion"> 
                <option value="floor">floor</option> 
                <option value="ceil">ceil</option> 
                <option value="trunc">trunc</option> 
            </select> 
        </div>
        <button id="calcular">Calcular</button>
        <div class="resultado" id="resultado">—</div>
        </div> 
        <script> 
            const inputNumero = document.getElementById("numero");
            const selectOperacion = document.getElementById("operacion");
            const boton = document.getElementById("calcular");
            const cajaResultado = document.getElementById("resultado");
            boton.addEventListener("click", () => { 
                const valorTexto = inputNumero.value.trim();
                if (valorTexto === ""){ 
                    cajaResultado.textContent = "Escribe un número"; 
                    return; 
                } const numero = Number(valorTexto);
                if (Number.isNaN(numero)) { 
                    cajaResultado.textContent = "Eso no es un número"; 
                    return; 
                } 
                const operacion = selectOperacion.value;
                let resultado; 
                switch (operacion) { 
                    case "floor": resultado = Math.floor(numero); 
                    break; 
                    case "ceil": resultado = Math.ceil(numero);
                    break;
                    case "trunc": resultado = Math.trunc(numero); 
                    break; 
                    default: resultado = "Operación no válida"; 
                }
                cajaResultado.textContent = `${operacion}(${numero}) = ${resultado}`;
            }); 
        </script>
        
    </body> 
</html>
