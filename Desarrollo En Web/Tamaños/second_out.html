<!DOCTYPE html>
<html class="no-js" lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1">
        <title>Segundos Fuera</title>
        <style>
            body{
                background-color: rgb(0, 0, 0);
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: rgb(0, 255, 170);
            }
        </style>
    </head>
    <body>
        <div id="contador"></div>
        <script>
            let a=0;
            //setTimeout(miFuncion, 1000);
            //window.setTimeout();
            window.setInterval(miFuncion, 3000)
            window.setTimeout(miBorrado, 6000)
            function miFuncion(){
                contador.innerHTML="Holi"
            }
            function miBorrado(){
                contador.innerHTML="Bye"
                contador.innerHTML=a;
                a++;
                setTimeout(miBorrado, 200);
            }
        </script>
    </body>
</html>
