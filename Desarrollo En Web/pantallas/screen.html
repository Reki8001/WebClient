<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1">
        <title>Pantalla Screen</title>
        <style>
            body{
                background-color: bisque;
            }
        </style>
    </head>
    <body>
        <div>

        </div>
        <script>
            window.addEventListener("load", function(){
                document.querySelector("div").innerHTML="ALTURA:"+screen.height+"<br>";
                document.querySelector("div").innerHTML+="ALTURA DISPONIBLE"+screen.availHeight+"<br>";
                document.querySelector("div").innerHTML+="ANCHURA"+screen.width+"<br>";
                document.querySelector("div").innerHTML+="ANCHURA DISPONIBLE"+screen.availWidth+"<br>";
                document.querySelector("div").innerHTML+="PROFUNDIAD COLOR"+screen.colorDepth+"<br>";
                document.querySelector("div").innerHTML+="PROFUNDIDAD PIXELES"+screen.pixelDepth+"<br>";
            })
        </script>
    </body>
